# Runs the offline test suite on every push and pull request.
# No Cohere key or other secret is used: live Cohere tests stay skipped
# (they run only when RUN_LIVE_COHERE_TESTS=1) and every other test uses fakes.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned, not ubuntu-latest, so the OS image changes only when we choose
    # (ubuntu-latest moves to newer Ubuntu releases on GitHub's schedule).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUN_LIVE_COHERE_TESTS: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version  # 3.12.16, the same version Render should use

      - name: Install pinned dependencies
        # The same constraints file Render's build command uses.
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Check installed dependencies
        run: |
          python -m pip check
          python -m pip freeze --exclude-editable

      - name: Run offline tests
        run: python -m pytest -q
