[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Customer support AI agent with keyword, semantic and hybrid retrieval."
requires-python = ">=3.10"
dependencies = [
    "cohere>=7.3,<8",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
]

[tool.setuptools.packages.find]
where = ["src"]
